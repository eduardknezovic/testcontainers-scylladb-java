plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM // Updated syntax for vendor
    }
}

dependencies {
    // Updated implementation/test dependencies 
    implementation 'org.testcontainers:scylladb:1.20.5'
    implementation 'com.datastax.oss:java-driver-core:4.17.0'
    
    // Updated JUnit dependencies to newer versions
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.testcontainers:scylladb:1.20.5'
    testImplementation 'com.datastax.oss:java-driver-core:4.17.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

application {
    mainClass = 'Main'
}
